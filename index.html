<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>AI Travel Assistant</title>
  </head>
  <body>
    <div id="root"></div>
    <!-- We change this to a module script -->
    <script type="module">
      // We import the mount function directly from the newest version of stlite
      import { mount } from "https://cdn.jsdelivr.net/npm/@stlite/browser@1.9.1/build/stlite.js";
      
      mount(
        {
         requirements: ["pandas", "requests", "pytz", "matplotlib", "qrcode"],
          entrypoint: "Group1.py", // Group1.py is the true core of your app!
          files: {
            "Group1.py": { url: "./Group1.py" },
            "QR.py": { url: "./QR.py" },
            "dataset_travel.csv": { url: "./dataset_travel.csv" },
            "logo.png": { url: "./logo.png" }
          }
        },
        document.getElementById("root")
      );
    </script>
  </body>
</html>
