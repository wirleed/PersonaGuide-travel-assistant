<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>AI Travel Assistant</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@stlite/browser@0.76.0/build/style.css" />
  </head>
  <body>
    <div id="root"></div>
    <script src="https://cdn.jsdelivr.net/npm/@stlite/browser@0.76.0/build/stlite.js"></script>
    <script>
      stlite.mount(
        {
          requirements: ["pandas"], // Add other libraries from your requirements.txt here
          entrypoint: "QR.py", // This tells it which Python file to run first
          files: {
            "QR.py": { url: "./QR.py" },
            "Group1.py": { url: "./Group1.py" },
            "dataset_travel.csv": { url: "./dataset_travel.csv" },
            "logo.png": { url: "./logo.png" }
          }
        },
        document.getElementById("root")
      );
    </script>
  </body>
</html>
